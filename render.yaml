# Render Blueprint Specification for Omnysync ERP Platform
# Single Unified Web Service (Frontend SPA + Modular Monolith API + Database Engine)
services:
  - type: web
    name: omnysync-erp
    runtime: node
    plan: free
    region: oregon
    buildCommand: NODE_OPTIONS="--max-old-space-size=256" npm install --no-audit --no-fund && NODE_OPTIONS="--max-old-space-size=256" npm run build
    startCommand: node --max-old-space-size=256 apps/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OMNYSYNC_DEMO_MODE
        value: "false"
      - key: OMNYSYNC_DEMO_SEED
        value: "true"
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "10"
      - key: OMNYSYNC_SESSION_SECRET
        generateValue: true
