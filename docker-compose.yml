version: '3.8'

services:
  erp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnysync_erp
    restart: always
    ports:
      - "4000:10000"
    environment:
      - NODE_ENV=production
      - PORT=10000
      - OMNYSYNC_DEMO_SEED=true
      - OMNYSYNC_DEMO_MODE=false
      - KEEP_ALIVE_ENABLED=false
    volumes:
      - erp_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  erp_data:
    driver: local
